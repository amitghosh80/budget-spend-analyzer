server {
    listen 80;
    server_name analyzemyexpenses.net www.analyzemyexpenses.net;
    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name analyzemyexpenses.net www.analyzemyexpenses.net;

    ssl_certificate     /etc/letsencrypt/live/analyzemyexpenses.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/analyzemyexpenses.net/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Redirect www → apex
    if ($host = www.analyzemyexpenses.net) {
        return 301 https://analyzemyexpenses.net$request_uri;
    }

    # Serve built React frontend
    root /opt/analyzemyfinances/frontend/dist;
    index index.html;

    # API routes → FastAPI backend
    location ~ ^/(income|expenses|auth)(/|$) {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SPA fallback — all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
